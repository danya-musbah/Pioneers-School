<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">مدرسة مرسومة كمبنى مفتوح من الداخل</title>
  <desc id="description">مبنى مدرسي بطابقين وفصل ومكتبة وشؤون طلبة وشباك إدارة وساحة وبوابة.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop offset="0" stop-color="#8dc8e8"/>
      <stop offset=".72" stop-color="#d1e8e5"/>
      <stop offset="1" stop-color="#e8ebc5"/>
    </linearGradient>
    <linearGradient id="roof" x2="0" y2="1">
      <stop stop-color="#2cb8aa"/>
      <stop offset="1" stop-color="#147b76"/>
    </linearGradient>
    <linearGradient id="wall" x2="0" y2="1">
      <stop stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#ead9b9"/>
    </linearGradient>
    <linearGradient id="floor" x2="0" y2="1">
      <stop stop-color="#f8edcf"/>
      <stop offset="1" stop-color="#e9d5af"/>
    </linearGradient>
    <filter id="paper-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#032340" flood-opacity=".2"/>
    </filter>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#032340" flood-opacity=".2"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1320" cy="145" r="76" fill="#f4cb6b" opacity=".9"/>
  <path d="M0 392Q155 305 315 367T636 355T950 371T1267 342T1600 367V630H0Z" fill="#aacb9d"/>
  <path d="M0 455Q185 376 370 435T735 413T1090 433T1410 402T1600 428V690H0Z" fill="#83ad86"/>
  <g fill="#fffaf0" opacity=".82">
    <path d="M160 155c0-31 25-56 56-56 19 0 36 10 46 25 8-24 31-41 58-41 36 0 65 29 65 65 25 2 45 23 45 49H160c-19 0-34-15-34-34s15-34 34-34Z"/>
    <path d="M1040 242c0-22 18-40 40-40 14 0 26 7 33 18 6-18 23-30 43-30 26 0 47 21 47 47 18 2 33 17 33 35h-196c-14 0-25-11-25-25s11-25 25-25Z" opacity=".72"/>
  </g>
  <g fill="none" stroke="#355166" stroke-width="7" stroke-linecap="round" opacity=".72">
    <path d="M1120 118q20-22 40 0q20-22 40 0"/>
    <path d="M1230 250q15-17 30 0q15-17 30 0"/>
  </g>

  <path d="M0 702Q210 668 410 704T805 690T1190 710T1600 682V1000H0Z" fill="#b4c888"/>
  <path d="M0 832Q230 780 470 822T950 810T1320 830T1600 804V1000H0Z" fill="#8fae70"/>
  <path d="M620 1000 730 720h180l118 280Z" fill="#e5c990" opacity=".9"/>
  <path d="M770 1000 820 720h45l55 280Z" fill="#f5e2b8" opacity=".86"/>

  <!-- Far yard trees, shaped with rounded, hand-cut edges. -->
  <g stroke="#032340" stroke-width="7" stroke-linejoin="round">
    <path d="M110 754V531" stroke="#8b6444" stroke-width="30" stroke-linecap="round"/>
    <path d="M110 562C37 567 25 488 76 465c-34-57 29-107 70-73 25-67 104-48 96 20 63 20 43 104-12 112 12 50-55 84-91 48-8 15-18 25-29 30Z" fill="#77a77e"/>
    <path d="M1480 728V486" stroke="#8b6444" stroke-width="30" stroke-linecap="round"/>
    <path d="M1480 517c-74 4-86-77-35-99-35-57 28-107 70-73 25-67 103-48 96 20 62 20 43 104-13 112 13 50-54 84-90 48-8 15-18 25-28 30Z" fill="#77a77e"/>
  </g>
  <g fill="#f3cf72" stroke="#032340" stroke-width="5">
    <circle cx="48" cy="807" r="23"/><circle cx="86" cy="824" r="19"/><circle cx="1522" cy="794" r="22"/><circle cx="1554" cy="820" r="18"/>
  </g>

  <!-- Raised paper shadow beneath the open building. -->
  <ellipse cx="805" cy="754" rx="610" ry="54" fill="#032340" opacity=".15" filter="url(#soft-shadow)"/>
  <g filter="url(#paper-shadow)" stroke="#032340" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <!-- Main school shell and visible cutaway floors. -->
    <path d="M224 298 802 170l575 128v398H224Z" fill="url(#wall)"/>
    <path d="m224 298 578-128 575 128-51 63-524-109-526 109Z" fill="url(#roof)"/>
    <path d="M224 361h1153v19H224Z" fill="#d1a34f" stroke-width="5"/>
    <path d="M224 520h1153v22H224Z" fill="#d1a34f" stroke-width="5"/>
    <path d="M224 696h1153v30H224Z" fill="#c49345" stroke-width="6"/>
    <path d="M224 380h1153v140H224Z" fill="url(#floor)" stroke-width="5"/>
    <path d="M224 542h1153v154H224Z" fill="#f4e5c3" stroke-width="5"/>
    <path d="M800 380v316" fill="none" stroke="#b48c55" stroke-width="8"/>

    <!-- Bell tower: a small school landmark above the roof line. -->
    <path d="M686 200V82h232v141" fill="#f8edcf" stroke-width="8"/>
    <path d="m660 92 142-66 142 66Z" fill="#d17959" stroke-width="8"/>
    <path d="M756 200v-78c0-28 22-51 48-51s48 23 48 51v78Z" fill="#75bce8" stroke-width="8"/>
    <path d="M804 72v96" fill="none" stroke="#032340" stroke-width="7"/>
    <circle cx="804" cy="168" r="13" fill="#d9a73e" stroke-width="5"/>
    <path d="M786 207h37" fill="none" stroke="#032340" stroke-width="7"/>

    <!-- Upper classroom: chalkboard, books, desks and sunny windows. -->
    <rect x="264" y="407" width="203" height="83" rx="9" fill="#24796d" stroke-width="6"/>
    <path d="M290 438h119M290 458h82" stroke="#fff4d6" stroke-width="6" opacity=".84"/>
    <g fill="#75bce8" stroke-width="6">
      <rect x="501" y="401" width="92" height="78" rx="10"/>
      <rect x="613" y="401" width="92" height="78" rx="10"/>
    </g>
    <g fill="#f3cf72" stroke-width="5">
      <path d="M500 442h94M612 442h94"/>
    </g>
    <g fill="#d9a73e" stroke-width="6">
      <path d="M305 493h104l-12 18H317Z"/>
      <path d="M486 493h104l-12 18H498Z"/>
      <path d="M629 493h92l-10 18h-72Z"/>
    </g>
    <g fill="#f8f1df" stroke-width="4">
      <rect x="340" y="469" width="24" height="13" rx="3"/>
      <rect x="530" y="469" width="24" height="13" rx="3"/>
      <rect x="660" y="469" width="24" height="13" rx="3"/>
    </g>

    <!-- Upper library: sturdy shelves and distinct book spines. -->
    <rect x="878" y="400" width="425" height="105" rx="8" fill="#d7b783" stroke-width="6"/>
    <path d="M879 449h423M879 481h423" fill="none" stroke="#8b6444" stroke-width="7"/>
    <g stroke-width="4">
      <path d="M902 411v34M930 405v40M962 414v31M1000 407v38M1032 414v31M1070 404v41M1101 412v33M1137 405v40M1172 413v32M1212 406v39M1250 412v33" stroke="#258fc0" stroke-linecap="round"/>
      <path d="M917 455v24M949 453v26M986 458v21M1018 451v28M1055 455v24M1087 452v27M1124 457v22M1158 452v27M1197 456v23M1234 450v29" stroke="#d17959" stroke-linecap="round"/>
    </g>
    <path d="M885 493h411" stroke="#6b5039" stroke-width="5"/>

    <!-- Registry and administration windows on the lower floor. -->
    <rect x="284" y="567" width="238" height="99" rx="12" fill="#dcebf0" stroke-width="7"/>
    <path d="M302 590h203M302 615h147" stroke="#75bce8" stroke-width="8" stroke-linecap="round"/>
    <path d="M354 627h98v30h-98Z" fill="#f3cf72" stroke-width="5"/>
    <path d="M558 563h190v124H558Z" fill="#ead6ad" stroke-width="7"/>
    <path d="M580 587h142M580 614h142M580 641h99" stroke="#ba9b69" stroke-width="6" stroke-linecap="round"/>
    <rect x="846" y="567" width="236" height="99" rx="12" fill="#dcebf0" stroke-width="7"/>
    <path d="M865 590h197M865 615h142" stroke="#75bce8" stroke-width="8" stroke-linecap="round"/>
    <path d="M925 628h78v30h-78Z" fill="#d9a73e" stroke-width="5"/>
    <rect x="1110" y="565" width="213" height="119" rx="10" fill="#c7a36e" stroke-width="7"/>
    <path d="M1131 589h170M1131 619h170M1131 649h132" stroke="#f8edcf" stroke-width="7" stroke-linecap="round"/>

    <!-- Open front entrance and steps. -->
    <path d="M725 696V609c0-44 35-79 79-79s79 35 79 79v87Z" fill="#24796d" stroke-width="8"/>
    <path d="M760 696v-83c0-24 20-44 44-44s44 20 44 44v83Z" fill="#75bce8" stroke-width="7"/>
    <circle cx="836" cy="634" r="6" fill="#f8f1df" stroke-width="3"/>
    <path d="M684 727h240M700 744h208" fill="none" stroke="#c49345" stroke-width="8"/>
  </g>

  <!-- Gate and fence in the foreground, separate from the room buttons. -->
  <g fill="none" stroke="#032340" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M443 862h718M464 813v101M1140 813v101M492 827v87M532 827v87M572 827v87M612 827v87M652 827v87M692 827v87M732 827v87M772 827v87M812 827v87M852 827v87M892 827v87M932 827v87M972 827v87M1012 827v87M1052 827v87M1092 827v87"/>
    <path d="M762 861V804c0-30 24-54 54-54s54 24 54 54v57M870 861V804c0-30 24-54 54-54s54 24 54 54v57" stroke="#147b76" stroke-width="9"/>
    <path d="M762 804h54M870 804h54" stroke="#d9a73e" stroke-width="8"/>
  </g>
  <g fill="#f8f1df" stroke="#032340" stroke-width="6">
    <circle cx="804" cy="798" r="9"/><circle cx="912" cy="798" r="9"/>
  </g>
  <g fill="#d17959" stroke="#032340" stroke-width="5" stroke-linejoin="round">
    <path d="m367 820 23-56 23 56Z"/><path d="m1196 825 24-61 24 61Z"/>
  </g>
</svg>
